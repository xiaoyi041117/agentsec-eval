[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec-eval"
version = "0.1.0"
description = "Reproducible, side-effect-free security evaluation for tool-using AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
keywords = ["ai-safety", "llm-agents", "tool-use", "security-evaluation", "red-teaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

[project.scripts]
agentsec-eval = "agentsec_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["legacy*"]
